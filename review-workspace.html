<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>مساحة المراجعة | مُعتمد</title>
<link rel="icon" type="image/png" href="lo.png"/>
<link rel="stylesheet" href="assets/mutamad-app.css"/>
  <link rel="stylesheet" href="assets/mutamad-government.css" />
</head>
<body class="review-page">
<div class="app">
  <aside class="sidebar">
    <div class="brand"><img src="lo.png" alt="شعار مُعتمد"/><span class="brand-word">مُعتمد</span></div>
    <div class="role-pill">مسؤول الامتثال</div>
    <nav class="nav">
      <a href="compliance-dashboard.html"><span class="nav-icon">▦</span> لوحة الامتثال</a>
      <a class="active" href="review-workspace.html"><span class="nav-icon">✓</span> مساحة المراجعة</a>
      <a href="index.html"><span class="nav-icon">⌂</span> الرئيسية</a>
    </nav>
    <div class="sidebar-card">
      <h3>مساحة المراجعة</h3>
      <p>اتخاذ قرار الاعتماد أو طلب التعديل استنادًا إلى بيانات الحملة ونتائج الفحص.</p>
    </div>
    <button class="logout" onclick="Mutamad.logout()">تسجيل الخروج</button>
  </aside>

  <main class="main">
    <div class="main-inner">
      <header class="topbar">
        <div class="page-title">
          <h1>مساحة المراجعة</h1>
          <p>مراجعة بيانات الحملة ونتائج الفحص ثم اتخاذ قرار الاعتماد أو طلب التعديل.</p>
        </div>
        <a class="btn btn-secondary" href="compliance-dashboard.html">العودة للوحة الامتثال</a>
      </header>
      <div id="holder" class="content-stack"></div>
    </div>
  </main>
</div>

<script src="assets/mutamad-app.js"></script>
<script>
  let campaigns = Mutamad.getCampaigns();
  const id = localStorage.getItem(Mutamad.KEYS.currentReview) ||
             localStorage.getItem(Mutamad.KEYS.currentCampaign);
  let campaign = id ? campaigns.find(function (c) { return c.id === id; }) : null;

  function render() {
    const holder = document.getElementById("holder");
    if (!campaign) {
      holder.innerHTML = '<div class="empty"><div><h3>لا توجد حملة محددة</h3>' +
        '<p>افتح حملة من لوحة الامتثال لعرض مساحة المراجعة المخصصة لها.</p>' +
        '<a class="btn btn-primary" href="compliance-dashboard.html">عرض طلبات المراجعة</a></div></div>';
      return;
    }

    const findings = campaign.findings || [];
    const findingsHtml = findings.length
      ? findings.map(function (f) {
          const cls = Mutamad.riskClass(f.risk_level);
          return '<div class="finding ' + cls + '"><div class="finding-top">' +
            '<h4>' + Mutamad.escapeHtml(f.claim_text) + '</h4>' +
            '<span class="badge ' + cls + '">' + Mutamad.riskLabel(f.risk_level) + '</span></div>' +
            '<p>' + Mutamad.escapeHtml(f.reason || "") + '</p>' +
            '<p><strong>المرجع:</strong> ' + Mutamad.escapeHtml(f.rule_reference || "") + '</p></div>';
        }).join("")
      : '<div class="empty"><p>لا توجد ملاحظات مرصودة على هذه الحملة.</p></div>';

    holder.innerHTML =
      '<section class="hero-box"><h2>' + Mutamad.escapeHtml(campaign.title || "حملة للمراجعة") + '</h2>' +
      '<p>' + Mutamad.escapeHtml(campaign.product_type_label || "منتج غير محدد") + ' — ' +
        Mutamad.escapeHtml(campaign.channel || "قناة غير محددة") + ' — الحالة الحالية: ' +
        Mutamad.statusLabel(campaign.status) + '</p></section>' +

      '<section class="section-card"><div class="card-head"><div>' +
      '<h3>بيانات الحملة محل المراجعة</h3>' +
      '<p>معلومات المنتج والقناة والجمهور والنص الذي سيظهر للعميل.</p></div></div>' +
      '<div class="card-body"><div class="grid-3">' +
      '<div class="kpi"><span>نوع المنتج</span><strong>' + Mutamad.escapeHtml(campaign.product_type_label || "—") + '</strong></div>' +
      '<div class="kpi"><span>القناة</span><strong>' + Mutamad.escapeHtml(campaign.channel || "—") + '</strong></div>' +
      '<div class="kpi"><span>الجمهور</span><strong>' + Mutamad.escapeHtml(campaign.audience || "—") + '</strong></div>' +
      '</div><div class="summary-card" style="margin-top:14px"><h4>نص الإعلان</h4>' +
      '<p>' + Mutamad.escapeHtml(campaign.content_text || "") + '</p></div></div></section>' +

      '<section class="section-card"><div class="card-head"><div>' +
      '<h3>نتائج الفحص والمراجع التنظيمية</h3>' +
      '<p>تدعم هذه النتائج اتخاذ قرار مراجعة مبني على سبب واضح ومرجع تنظيمي.</p></div></div>' +
      '<div class="card-body"><div class="grid-3">' +
      '<div class="kpi"><span>درجة الجاهزية</span><strong>' + Number(campaign.readiness_score || 0) + '%</strong></div>' +
      '<div class="kpi"><span>مستوى المخاطر</span><strong>' + Mutamad.riskLabel(campaign.risk_level) + '</strong></div>' +
      '<div class="kpi"><span>عدد الملاحظات</span><strong>' + findings.length + '</strong></div>' +
      '</div><div class="analysis-grid" style="margin-top:14px">' + findingsHtml + '</div>' +
      '<div class="summary-card" style="margin-top:14px"><h4>الصياغة المقترحة</h4>' +
      '<p>' + Mutamad.escapeHtml(campaign.suggested_rewrite || "لا توجد صياغة مقترحة.") + '</p></div></div></section>' +

      '<section class="section-card"><div class="card-head"><div>' +
      '<h3>قرار الامتثال</h3>' +
      '<p>اعتماد الحملة يجعلها جاهزة للتوثيق ضمن التقارير. أما طلب التعديل فيعيدها إلى قائمة الحملات الراجعة لدى التسويق.</p></div></div>' +
      '<div class="card-body"><div class="field"><label>ملاحظات القرار</label>' +
      '<textarea id="decisionNotes" placeholder="اكتب سبب القرار أو متطلبات التعديل عند الحاجة.">' +
        Mutamad.escapeHtml(campaign.compliance_notes || "") + '</textarea></div>' +
      '<div class="btn-row center-actions"><button class="btn btn-primary" onclick="approveCampaign()">اعتماد الحملة</button>' +
      '<button class="btn btn-accent" onclick="requestRevision()">طلب تعديل</button></div>' +
      '<div id="decisionNote" class="message" style="margin-top:12px"></div></div></section>';
  }

  function saveAll() { Mutamad.saveCampaigns(campaigns); }
  function show(type, msg) {
    const n = document.getElementById("decisionNote");
    n.className = "message " + type + " show";
    n.textContent = msg;
  }

  function approveCampaign() {
    campaign.compliance_notes = document.getElementById("decisionNotes").value.trim();
    campaign.compliance_decision = "approved";
    campaign.status = "approved";
    campaign.approved_at = Mutamad.shortDate(Mutamad.nowISO());
    campaign.updated_at = Mutamad.shortDate(Mutamad.nowISO());
    Mutamad.pushTimeline(campaign, "اعتمد مسؤول الامتثال الحملة");
    saveAll();
    show("success", "تم اعتماد الحملة. ستظهر في لوحة المدير وضمن التقارير المتاحة.");
    setTimeout(function () { location.href = "compliance-dashboard.html"; }, 800);
  }

  function requestRevision() {
    const notes = document.getElementById("decisionNotes").value.trim();
    if (!notes) { show("error", "أدخل ملاحظات التعديل قبل إعادة الحملة."); return; }
    campaign.compliance_notes = notes;
    campaign.compliance_decision = "needs_revision";
    campaign.status = "needs_revision";
    campaign.updated_at = Mutamad.shortDate(Mutamad.nowISO());
    Mutamad.pushTimeline(campaign, "أعاد مسؤول الامتثال الحملة للتعديل");
    saveAll();
    show("success", "تمت إعادة الحملة إلى فريق التسويق للتعديل.");
    setTimeout(function () { location.href = "compliance-dashboard.html"; }, 800);
  }

  render();
</script>
</body>
</html>
