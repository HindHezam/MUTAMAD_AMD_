<!DOCTYPE html>

<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>طلب الانضمام | مُعتمد</title>
<style>
    @import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap");

    :root {
      --navy: #002134;
      --navy-2: #002134;
      --navy-3: #023a55;
      --teal: #837FD8;
      --teal-dark: #023a55;
      --gold: #966769;
      --bg: #F6F8FA;
      --white: #FFFFFF;
      --text: #002134;
      --muted: #6B7392;
      --line: #E3E6F0;
      --soft: #EEF3F7;
      --teal-soft: #EEEBF6;
      --shadow: 0 24px 70px rgba(0,33,52, 0.16);
      --shadow-soft: 0 14px 36px rgba(0,33,52, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: "IBM Plex Sans Arabic", Arial, sans-serif;
      background: #FFFFFF;
      color: var(--text);
      direction: rtl;
    }

    .page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px;
    }

    .join-shell {
      width: min(1420px, 100%);
      min-height: 800px;
      display: grid;
      grid-template-columns: 0.72fr 1.28fr;
      background: rgba(255,255,255,0.78);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(255,255,255,0.78);
      border-radius: 38px;
      overflow: hidden;
      box-shadow: var(--shadow);
      position: relative;
      z-index: 1;
    }

    .side {
      position: relative;
      padding: 52px 48px;
      color: white;
      overflow: hidden;
      background:
        radial-gradient(circle at 20% 22%, rgba(131,127,216,0.30), transparent 30%),
        radial-gradient(circle at 86% 14%, rgba(231,143,129,0.16), transparent 28%),
        linear-gradient(145deg, #002134 0%, #002134 55%, #0C3449 100%);
    }

    .side::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
      background-size: 44px 44px;
      opacity: 0.45;
    }

    .side > * {
      position: relative;
      z-index: 1;
    }

    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .logo {
      width: 158px;
      height: auto;
      display: block;
      object-fit: contain;
      filter: drop-shadow(0 16px 24px rgba(0,0,0,0.20));
    }

    .home-link {
      color: rgba(255,255,255,0.72);
      font-size: 13px;
      font-weight: 600;
      padding: 9px 13px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.16);
      background: rgba(255,255,255,0.06);
    }

    .home-link:hover {
      color: white;
      background: rgba(255,255,255,0.10);
    }

    .side-content {
      margin-top: 88px;
      max-width: 520px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.20);
      color: #EEEBF6;
      font-weight: 700;
      font-size: 13px;
      margin-bottom: 24px;
    }

    .side-content h1 {
      font-size: 44px;
      line-height: 1.32;
      margin-bottom: 22px;
      letter-spacing: -0.6px;
    }

    .side-content p {
      color: #DCE7F2;
      font-size: 16.5px;
      line-height: 2;
      font-weight: 300;
    }

    .form-side {
      padding: 62px 68px;
      display: grid;
      align-items: center;
    }

    .form-card {
      width: 100%;
      max-width: 760px;
      margin: auto;

    }

    .card-head {
      margin-bottom: 40px;
    }

    .card-head span {
      display: inline-flex;
      padding: 8px 13px;
      border-radius: 999px;
      background: var(--teal-soft);
      color: var(--teal-dark);
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 14px;
    }

    .card-head h2 {
      font-size: 34px;
      color: var(--navy);
      line-height: 1.32;
      margin-bottom: 10px;
    }

    .card-head p {
      color: var(--muted);
      font-size: 14.5px;
      line-height: 1.9;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 28px;
    }

    .field label {
      display: block;
      color: #344054;
      font-size: 14px;
      font-weight: 700;
  margin-bottom: 4px; 


    }

    .field input,
    .field select {
      width: 100%;
      height: 58px;
      border: 1px solid #D8E0E8;
      border-radius: 17px;
      background: white;
      color: var(--text);
      outline: none;
      transition: 0.2s ease;
      font-size: 14.5px;
      padding: 0 18px;
    }

    /* تغيير خط الـ Placeholder */
    .field input::placeholder,
    .field select::placeholder {
      color: #9CA3AF;
      font-weight: 400;
      font-size: 14.5px;
    }

    .field input:focus,
    .field select:focus {
      border-color: var(--teal);
      box-shadow: 0 0 0 4px rgba(131,127,216,0.12);
    }

    .actions {
      margin-top: 42px;
    }

    .btn {
      min-height: 58px;
      border-radius: 17px;
      border: 0;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 28px;
      font-size: 15.5px;
      font-weight: 800;           /* خط أقوى للزر */
      transition: 0.2s ease;
      white-space: nowrap;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .btn-primary {
      width: 100%;
      color: white;
      background: linear-gradient(135deg, var(--teal), var(--teal-dark));
      box-shadow: 0 16px 30px rgba(131,127,216,0.24);
    }

    .success {
      display: none;
      margin-top: 20px;
      padding: 15px 16px;
      border-radius: 18px;
      background: #ECFDF5;
      color: #067647;
      border: 1px solid #ABEFC6;
      font-size: 13px;
      font-weight: 700;
    }

    @media (max-width: 1050px) {
      .join-shell {
        grid-template-columns: 1fr;
      }
      .side, .form-side {
        padding: 42px 32px;
      }
    }

    @media (max-width: 700px) {
      .form-grid {
        grid-template-columns: 1fr;
        gap: 22px;
      }
      .join-shell {
        border-radius: 26px;
      }
    }

.home-link {
  text-decoration: none !important;
}


    ::placeholder {
  font-family: "IBM Plex Sans Arabic";
  font-weight: 300;
}

.field input,
.field select {
  font-family: "IBM Plex Sans Arabic";
  font-weight: 400;
}

.btn-primary {
  font-family: "IBM Plex Sans Arabic";
  font-weight: 700;
}


.actions {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-top: 36px;
}
.actions .btn { width: 100%; }

.btn {
  min-height: 56px;
  border-radius: 17px;
  border: none;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0 26px;
  font-family: "IBM Plex Sans Arabic";
  font-weight: 600;
  font-size: 15px;
  text-decoration: none;
  white-space: nowrap;
}

.btn-primary {
  background: linear-gradient(135deg, var(--navy-3), var(--navy));
  color: white;
  box-shadow: 0 16px 30px rgba(0,33,52,0.24);
}

.btn-secondary {
  background: white;
  border: 1px solid var(--line);
  color: var(--navy);
}


.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr; /* عمودين متساويين */
  gap: 28px;
  align-items: stretch; /* يخلي كل البوكسات بنفس الارتفاع */

}
  </style>
<link rel="icon" type="image/png" href="lo.png" />
<link href="assets/mutamad-theme.css" rel="stylesheet"/>  <link rel="stylesheet" href="assets/mutamad-government.css" />
</head>
<body class="join-page">
<main class="page">
<section class="join-shell">
<!-- الجانب الأخضر -->
<aside class="side">
<div>
<div class="top-nav">
<a href="index.html">
<img alt="شعار مُعتمد" class="logo" src="lo.png"/>
<span class="brand-word">مُعتمد</span>
</a>
<a class="home-link" href="index.html">الرئيسية</a>
</div>
<div class="side-content">
<span class="eyebrow">طلب انضمام جهة</span>
<h1>طلب انضمام جهة إلى منصة مُعتمد</h1>
<p>
            أدخل بيانات الجهة والمسؤول الرسمي لتجهيز مساحة العمل المؤسسية الخاصة بها.
            </p>
</div>
</div>
</aside>
<!-- الجانب الأبيض -->
<section class="form-side">
<div class="form-card">
<div class="card-head">
<h2>بيانات الجهة والمسؤول</h2>
<p>أدخل البيانات الأساسية للجهة والمسؤول المعني لبدء تهيئة حساب مؤسسي على المنصة.</p>
</div>
<form id="joinForm">
<div class="form-grid">
<div class="field">
<label for="orgName">اسم الجهة</label>
<input id="orgName" placeholder="مثال: شركة / بنك / جهة حكومية" required="" type="text"/>
</div>
<div class="field">
<label for="orgType">نوع الجهة</label>
<select id="orgType" required="">
<option value="">اختر نوع الجهة</option>
<option value="financial">جهة مالية</option>
<option value="fintech">شركة تقنية مالية</option>
<option value="government">جهة حكومية</option>
<option value="commercial">جهة تجارية</option>
<option value="other">أخرى</option>
</select>
</div>
<div class="field">
<label for="managerName">اسم المسؤول</label>
<input id="managerName" placeholder="اسم الشخص المسؤول عن الطلب" required="" type="text"/>
</div>
<div class="field">
<label for="jobTitle">المسمى الوظيفي</label>
<input id="jobTitle" placeholder="مثال: مسؤول امتثال / مدير تسويق" required="" type="text"/>
</div>
<div class="field">
<label for="email">البريد الرسمي</label>
<input id="email" placeholder="name@organization.sa" required="" type="email"/>
</div>
<div class="field">
<label for="phone">رقم التواصل</label>
<input id="phone" placeholder="05xxxxxxxx" required="" type="tel"/>
</div>
</div>
<div class="actions">
<button class="btn btn-primary" type="submit">إرسال طلب الانضمام</button>
<button class="btn btn-secondary" type="button" onclick="location.href='login.html'">لدي حساب بالفعل</button>
</div>
<div class="success" id="successBox">
              تم استلام طلب الانضمام بنجاح.
            </div>
</form>
</div>
</section>
</section>
</main>
<script src="assets/mutamad-app.js"></script>
<script>
    const joinForm = document.getElementById("joinForm");
    const successBox = document.getElementById("successBox");

    joinForm.addEventListener("submit", function (event) {
      event.preventDefault();

      const request = {
        organization_name: document.getElementById("orgName").value,
        organization_type: document.getElementById("orgType").value,
        manager_name: document.getElementById("managerName").value,
        job_title: document.getElementById("jobTitle").value,
        email: document.getElementById("email").value,
        phone: document.getElementById("phone").value,
        created_at: new Date().toISOString()
      };

      localStorage.setItem("mutamad_join_request", JSON.stringify(request));

      successBox.style.display = "block";
      joinForm.reset();

      setTimeout(() => successBox.style.display = "none", 5000);
    });
  </script>
</body>
</html>
