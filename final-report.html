<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>التقرير النهائي | مُعتمد</title>
<link rel="icon" type="image/png" href="lo.png"/>
<style>
@import url("https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap");

:root{
  --navy:#002134; --navy-2:#011E2F; --navy-3:#023a55; --navy-deep:#03141E;
  --accent:#837FD8; --accent-lt:#a9a6e6;
  --green:#2F7d5b; --orange:#B06A0E; --red:#C0463A;
  --bg:#F4F6FA; --text:#002134; --muted:#5b6b76; --line:#E3E6F0;
  --shadow:0 22px 55px rgba(0,33,52,.16);
  --softShadow:0 12px 30px rgba(0,33,52,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;font-family:"Tajawal",Arial,sans-serif;
  background:
    radial-gradient(circle at 90% 0%, rgba(0,33,52,0.06), transparent 26%),
    var(--bg);
  color:var(--text);direction:rtl;line-height:1.85;
}
a{text-decoration:none;color:inherit}
button{font-family:inherit}

.app{min-height:100vh;display:grid;grid-template-columns:282px 1fr}
.sidebar{
  position:sticky;top:0;height:100vh;padding:24px 18px;color:#fff;overflow-y:auto;
  background:
    radial-gradient(circle at 20% 12%, rgba(131,127,216,0.22), transparent 30%),
    linear-gradient(180deg,#023a55 0%,#002134 55%,#03141E 100%);
}
.brand{display:flex;align-items:center;padding:6px 8px 24px;border-bottom:1px solid rgba(255,255,255,.10);margin-bottom:20px}
.brand img{width:150px;height:auto;display:block;object-fit:contain}
.role-pill{
  display:inline-flex;align-items:center;gap:8px;padding:8px 13px;border-radius:999px;
  background:rgba(255,255,255,.08);color:#EFEAFB;border:1px solid rgba(168,154,212,.45);
  font-size:12px;font-weight:600;margin-bottom:18px;
}
.role-pill::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent-lt)}
.nav{display:grid;gap:7px}
.nav a{
  min-height:46px;padding:0 13px;display:flex;align-items:center;gap:10px;border-radius:14px;
  color:rgba(255,255,255,.78);font-size:14px;font-weight:600;transition:.18s ease;
}
.nav a:hover,.nav a.active{background:rgba(255,255,255,.12);color:#fff}
.nav-icon{
  width:28px;height:28px;border-radius:11px;display:grid;place-items:center;
  background:rgba(255,255,255,.10);color:#E4DDF7;font-size:13px;font-weight:900;
}
.sidebar-card{margin-top:22px;padding:16px;border-radius:18px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12)}
.sidebar-card h3{font-size:14px;margin-bottom:8px}
.sidebar-card p{font-size:12px;color:rgba(255,255,255,.65);line-height:1.85}
.logout{
  width:100%;min-height:44px;margin-top:18px;border:1px solid rgba(255,255,255,.16);
  background:rgba(255,255,255,.06);color:rgba(255,255,255,.85);border-radius:12px;cursor:pointer;font-weight:700;
}
.logout:hover{background:rgba(255,255,255,.11);color:#fff}

.main{padding:30px;min-width:0}
.main-inner{width:min(1120px,100%);margin:0 auto;display:grid;gap:22px}
.topbar{min-height:72px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
.page-title h1{color:var(--navy);font-size:30px;line-height:1.3;margin-bottom:4px}
.page-title p{color:var(--muted);font-size:14px}
.top-actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{
  min-height:46px;padding:0 18px;border-radius:13px;border:0;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font-size:14px;font-weight:700;transition:.18s ease;white-space:nowrap;
}
.btn:hover{transform:translateY(-1px)}
.btn-primary{color:#fff;background:linear-gradient(135deg,#023a55,#002134 60%,#011D2D);box-shadow:0 14px 26px rgba(0,33,52,.26)}
.btn-secondary{background:#fff;color:var(--navy);border:1px solid var(--line);box-shadow:var(--softShadow)}

/* ----------- REPORT PAPER ----------- */
.report-paper{background:#fff;border:1px solid var(--line);border-radius:30px;box-shadow:var(--shadow);overflow:hidden}
.paper-head{
  padding:32px;color:#fff;position:relative;overflow:hidden;
  display:grid;grid-template-columns:1fr 190px;gap:24px;align-items:center;
  background:
    radial-gradient(circle at 12% 18%, rgba(131,127,216,0.22), transparent 32%),
    linear-gradient(180deg,#023a55 0%,#002134 55%,#03141E 100%);
}
.paper-head>*{position:relative;z-index:1}
.paper-logo{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.paper-logo img{width:170px;height:auto;display:block;object-fit:contain}
.paper-head h2{font-size:28px;line-height:1.45;margin-bottom:6px}
.paper-head p{color:#DCE7F2;font-size:14px;line-height:2;max-width:720px}
.stamp{
  width:168px;height:168px;border-radius:50%;border:3px solid rgba(168,154,212,.92);
  display:grid;place-items:center;text-align:center;transform:rotate(-8deg);
  background:rgba(131,127,216,.12);margin-inline-start:auto;
}
.stamp strong{color:#fff;font-size:26px;line-height:1.2;display:block}
.stamp span{color:#D9D5F4;font-size:10.5px;font-weight:900;display:block;margin-top:6px;line-height:1.6;padding:0 14px}

.paper-body{padding:30px;display:grid;gap:22px}
.meta-grid,.metric-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.meta-card,.metric{
  border:1px solid var(--line);background:#F8FAFD;border-radius:18px;padding:15px;
  min-height:92px;display:grid;align-content:space-between;
}
.meta-card span,.metric span{color:var(--muted);font-size:11px;font-weight:900}
.meta-card strong{color:var(--navy);font-size:17px;line-height:1.4}
.metric strong{color:var(--navy);font-size:28px;line-height:1}

.section{border:1px solid var(--line);background:#fff;border-radius:22px;overflow:hidden}
.section-head{padding:18px 20px 12px;border-bottom:1px solid var(--line);background:#FBFCFD}
.section-head h3{color:var(--navy);font-size:18px}
.section-head p{color:var(--muted);font-size:12px}
.section-body{padding:20px}
.summary-text{color:#344054;font-size:14px;line-height:2.1}

.status-layout{display:grid;grid-template-columns:1fr 300px;gap:22px;align-items:center}
.bars{display:grid;gap:12px}
.bar-row{display:grid;grid-template-columns:130px 1fr 52px;align-items:center;gap:12px}
.bar-row span{color:#344054;font-size:12px;font-weight:900}
.track{height:12px;border-radius:999px;background:#EEF1F7;overflow:hidden}
.track i{display:block;height:100%;width:0%;border-radius:inherit}
.fill-navy{background:linear-gradient(90deg,#3a5a72,#002134)}
.fill-orange{background:linear-gradient(90deg,#e2b27a,#B06A0E)}
.fill-green{background:linear-gradient(90deg,#86C9A6,#2F7d5b)}
.fill-red{background:linear-gradient(90deg,#e5a59e,#C0463A)}
.bar-row b{color:var(--navy);font-size:12px;text-align:left}

.decision-box{
  background:linear-gradient(145deg,#002134 0%,#023a55 60%,#5d59b0 130%);
  color:#fff;border-radius:20px;padding:22px;position:relative;overflow:hidden;
}
.decision-box span{color:#D9D5F4;font-size:12px;font-weight:900}
.decision-box h4{color:#fff;font-size:21px;margin:6px 0}
.decision-box p{color:#DCE7F2;font-size:12px;line-height:1.9}

.notes-box{background:#F8FAFD;border:1px solid var(--line);border-radius:18px;padding:16px;color:#344054;font-size:13px;line-height:2}
.signature-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.signature-card{
  border:1px solid var(--line);background:#F8FAFD;border-radius:18px;padding:18px;
  min-height:116px;display:grid;align-content:space-between;
}
.signature-card span{color:var(--muted);font-size:12px;font-weight:900}
.signature-card strong{color:var(--navy);font-size:17px}

.findings-wrap{display:grid;gap:12px}
.finding-card{
  border:1px solid var(--line);border-radius:14px;background:#fff;padding:14px 16px;display:grid;gap:6px;
  border-inline-start:4px solid var(--accent);
}
.finding-card.high{border-inline-start-color:var(--red)}
.finding-card.medium{border-inline-start-color:var(--orange)}
.finding-card.low{border-inline-start-color:var(--green)}
.finding-card h4{color:var(--navy);font-size:14.5px}
.finding-card p{color:#344054;font-size:12.5px;line-height:1.85}

.empty-state{
  min-height:260px;display:grid;place-items:center;text-align:center;border:1px dashed #B6C2D2;
  border-radius:26px;background:#fff;padding:28px;box-shadow:var(--softShadow);
}
.empty-state h3{color:var(--navy);font-size:20px;margin-bottom:6px}
.empty-state p{color:var(--muted);font-size:13px;line-height:1.9;max-width:560px;margin-bottom:16px}

@media print{
  @page{size:A4;margin:14mm}
  body{background:#fff}
  .sidebar,.topbar,.no-print{display:none!important}
  .app{display:block}
  .main{padding:0}
  .main-inner{width:100%;margin:0;gap:0}
  .report-paper{border:0;box-shadow:none;border-radius:0}
  .paper-head{border-radius:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .decision-box,.stamp,.fill-navy,.fill-green,.fill-orange,.fill-red{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .section{break-inside:avoid}
}
@media(max-width:1180px){
  .app{grid-template-columns:1fr}
  .sidebar{position:relative;height:auto;border-radius:0 0 24px 24px}
  .nav{grid-template-columns:repeat(3,1fr)}
  .sidebar-card{display:none}
}
@media(max-width:850px){
  .paper-head,.status-layout,.signature-row{grid-template-columns:1fr}
  .stamp{margin:0 auto}
  .meta-grid,.metric-grid{grid-template-columns:1fr 1fr}
}
@media(max-width:620px){
  .main{padding:16px}
  .topbar{flex-direction:column;align-items:flex-start}
  .top-actions,.top-actions .btn{width:100%}
  .nav,.meta-grid,.metric-grid{grid-template-columns:1fr}
  .bar-row{grid-template-columns:1fr;gap:6px}
}

/* formal refinement */
.page-title h1, .paper-head h2, .section-head h3, .meta-card strong, .metric strong, .signature-card strong { font-family:"Alexandria", Arial, sans-serif; }
.topbar{padding-bottom:16px;border-bottom:1px solid var(--line)}
.btn-secondary{background:#F6F9FB;color:var(--navy);border:1px solid #D8E3EA;box-shadow:none}
.report-paper{border:1px solid #DCE6ED;box-shadow:0 24px 48px rgba(1,30,49,.12)}
.paper-head{background:radial-gradient(circle at 14% 18%, rgba(53,184,173,.14), transparent 28%), linear-gradient(145deg,#0E455D 0%,#032D46 58%,#011E31 100%)}
.stamp{border-color:rgba(189,245,237,.75);background:rgba(53,184,173,.10)}
.stamp span{color:#E1FBF8}
.section-head{background:#F7FAFC}
.meta-card,.metric,.notes-box,.signature-card{background:#FAFCFD;border-color:#E1EAF0}
.decision-box{background:linear-gradient(145deg,#032D46 0%,#0E455D 64%,#1E9084 140%)}
.summary-text,.notes-box,.finding-card p{font-size:13.5px}
@media print{
  body{background:#fff !important}
  .report-paper{border:0 !important; box-shadow:none !important}
  .paper-body{padding:18px !important}
}

</style>
  <link rel="stylesheet" href="assets/mutamad-government.css" />
</head>

<body class="final-report-page">
<div class="app">
  <aside class="sidebar no-print">
    <div class="brand"><img alt="شعار مُعتمد" src="lo.png"/><span class="brand-word">مُعتمد</span></div>
    <div class="role-pill">مدير النظام</div>
    <nav class="nav">
      <a href="executive-dashboard.html"><span class="nav-icon">▦</span> لوحة المدير</a>
      <a href="reports.html"><span class="nav-icon">▤</span> التقارير التنفيذية</a>
      <a href="admin-settings.html"><span class="nav-icon">⚙</span> الإعدادات</a>
      <a href="index.html"><span class="nav-icon">⌂</span> الرئيسية</a>
    </nav>
    <div class="sidebar-card">
      <h3>التقرير النهائي</h3>
      <p>وثيقة رسمية تحمل شعار مُعتمد وختم التحقق من حالة الامتثال.</p>
    </div>
    <button class="logout" onclick="Mutamad.logout()">تسجيل الخروج</button>
  </aside>

  <main class="main">
    <div class="main-inner">
      <header class="topbar no-print">
        <div class="page-title">
          <h1>التقرير النهائي</h1>
          <p>عرض التقرير بصيغة مؤسسية رسمية قابلة للحفظ والطباعة.</p>
        </div>
        <div class="top-actions">
          <a class="btn btn-secondary" href="executive-dashboard.html">لوحة المدير</a>
          <a class="btn btn-secondary" href="reports.html">العودة للتقارير</a>
          <button class="btn btn-primary" onclick="window.print()">طباعة التقرير الرسمي</button>
        </div>
      </header>
      <div id="reportHolder"></div>
    </div>
  </main>
</div>

<script src="assets/mutamad-app.js"></script>
<script>
  function percent(part, total){ return total ? Math.round((part/total)*100) : 0; }
  function safe(v, fb){ fb = fb === undefined ? "—" : fb; return (v === undefined || v === null || String(v).trim() === "") ? fb : String(v); }

  function findingsHtml(report){
    const findings = report.findings || (report.campaign_snapshot && report.campaign_snapshot.findings) || [];
    if (!findings.length) return "";
    return '<section class="section"><div class="section-head"><h3>ملاحظات الفحص التنظيمي</h3>' +
      '<p>الملاحظات المرصودة على محتوى الحملة ومراجعها التنظيمية.</p></div>' +
      '<div class="section-body"><div class="findings-wrap">' +
      findings.map(function(f){
        const cls = Mutamad.riskClass(f.risk_level);
        return '<div class="finding-card ' + cls + '"><h4>' + Mutamad.escapeHtml(f.claim_text) +
          ' — ' + Mutamad.riskLabel(f.risk_level) + '</h4>' +
          '<p>' + Mutamad.escapeHtml(f.reason || "") + '</p>' +
          '<p><strong>المرجع:</strong> ' + Mutamad.escapeHtml(f.rule_reference || "") + '</p></div>';
      }).join("") + '</div></div></section>';
  }

  function renderReport(){
    const report = Mutamad.getCurrentReport();
    const holder = document.getElementById("reportHolder");

    if(!report){
      holder.innerHTML =
        '<div class="empty-state"><div><h3>لا يوجد تقرير محدد</h3>' +
        '<p>ارجع إلى صفحة التقارير التنفيذية وأنشئ تقريرًا جديدًا أو افتح تقريرًا محفوظًا.</p>' +
        '<a class="btn btn-primary" href="reports.html">العودة للتقارير</a></div></div>';
      return;
    }

    const c = report.counts || {};
    const total = c.total || 0, pending = c.pending || 0, revision = c.revision || 0,
          approved = c.approved || 0, rejected = c.rejected || 0, highRisk = c.highRisk || 0;

    holder.innerHTML =
    '<article class="report-paper">' +
      '<header class="paper-head"><div>' +
        '<div class="paper-logo"><img alt="شعار مُعتمد" src="lo.png"/><span class="brand-word">مُعتمد</span></div>' +
        '<h2>' + Mutamad.escapeHtml(safe(report.title, "تقرير امتثال الحملات قبل النشر")) + '</h2>' +
        '<p>' + Mutamad.escapeHtml(safe(report.scope, "تقرير تنفيذي عام للحملات الحالية")) + '</p>' +
      '</div>' +
      '<div class="stamp"><div><strong>' + Mutamad.escapeHtml(safe(report.stamp, "مُعتمد")) + '</strong>' +
        '<span>' + Mutamad.escapeHtml(safe(report.stamp_text, "تم التحقق من حالة الامتثال.")) + '</span></div></div>' +
      '</header>' +

      '<div class="paper-body">' +
        '<section class="meta-grid">' +
          '<div class="meta-card"><span>رقم التقرير</span><strong>' + Mutamad.escapeHtml(safe(report.id)) + '</strong></div>' +
          '<div class="meta-card"><span>تاريخ الإصدار</span><strong>' + Mutamad.escapeHtml(safe(report.created_at)) + '</strong></div>' +
          '<div class="meta-card"><span>نوع التقرير</span><strong>' + (report.type === "campaign" ? "تقرير اعتماد حملة" : "تقرير تنفيذي عام") + '</strong></div>' +
          '<div class="meta-card"><span>حالة الختم</span><strong>' + Mutamad.escapeHtml(safe(report.stamp, "مُعتمد")) + '</strong></div>' +
        '</section>' +

        '<section class="section"><div class="section-head"><h3>الملخص التنفيذي</h3>' +
          '<p>قراءة مختصرة لحالة الحملات والجاهزية والمخاطر.</p></div>' +
          '<div class="section-body"><p class="summary-text"><strong>' +
            Mutamad.escapeHtml(safe(report.summary_title, "ملخص حالة الامتثال")) + '</strong><br/>' +
            Mutamad.escapeHtml(safe(report.summary_text || report.summary)) + '</p></div></section>' +

        '<section class="section"><div class="section-head"><h3>المؤشرات الرئيسية</h3>' +
          '<p>أرقام التقرير الأساسية.</p></div><div class="section-body"><div class="metric-grid">' +
          '<div class="metric"><span>إجمالي الحملات</span><strong>' + total + '</strong></div>' +
          '<div class="metric"><span>معتمدة</span><strong>' + approved + '</strong></div>' +
          '<div class="metric"><span>طلبات تعديل</span><strong>' + revision + '</strong></div>' +
          '<div class="metric"><span>عالية المخاطر</span><strong>' + highRisk + '</strong></div>' +
          '</div></div></section>' +

        '<section class="section"><div class="section-head"><h3>مسار الاعتماد</h3>' +
          '<p>توزيع الحملات حسب الحالة داخل مسار العمل.</p></div><div class="section-body">' +
          '<div class="status-layout"><div class="bars">' +
            '<div class="bar-row"><span>بانتظار المراجعة</span><div class="track"><i class="fill-navy" style="width:' + percent(pending,total) + '%"></i></div><b>' + pending + '</b></div>' +
            '<div class="bar-row"><span>طلبات تعديل</span><div class="track"><i class="fill-orange" style="width:' + percent(revision,total) + '%"></i></div><b>' + revision + '</b></div>' +
            '<div class="bar-row"><span>معتمدة</span><div class="track"><i class="fill-green" style="width:' + percent(approved,total) + '%"></i></div><b>' + approved + '</b></div>' +
            '<div class="bar-row"><span>غير معتمدة</span><div class="track"><i class="fill-red" style="width:' + percent(rejected,total) + '%"></i></div><b>' + rejected + '</b></div>' +
          '</div>' +
          '<div class="decision-box"><span>نتيجة التقرير</span><h4>' + Mutamad.escapeHtml(safe(report.stamp, "تقرير امتثال")) + '</h4>' +
            '<p>' + Mutamad.escapeHtml(safe(report.stamp_text, "تم توثيق حالة الامتثال والجاهزية للحملات.")) + '</p></div>' +
          '</div></div></section>' +

        '<section class="section"><div class="section-head"><h3>الجاهزية والمخاطر</h3>' +
          '<p>مؤشرات تدعم قرار المتابعة الإداري.</p></div><div class="section-body"><div class="metric-grid">' +
          '<div class="metric"><span>متوسط الجاهزية</span><strong>' + (report.average_readiness == null ? "—" : report.average_readiness + "%") + '</strong></div>' +
          '<div class="metric"><span>نسبة المخاطر العالية</span><strong>' + safe(report.risk_rate, 0) + '%</strong></div>' +
          '<div class="metric"><span>معدل الاعتماد</span><strong>' + safe(report.approval_rate, 0) + '%</strong></div>' +
          '<div class="metric"><span>معدل طلبات التعديل</span><strong>' + safe(report.revision_rate, 0) + '%</strong></div>' +
          '</div></div></section>' +

        findingsHtml(report) +

        '<section class="section"><div class="section-head"><h3>التوصية الإدارية</h3>' +
          '<p>التوجيه المقترح بناءً على مؤشرات التقرير.</p></div>' +
          '<div class="section-body"><div class="notes-box">' + Mutamad.escapeHtml(safe(report.recommendation, "لا توجد توصية مسجلة.")) + '</div></div></section>' +

        '<section class="section"><div class="section-head"><h3>ملاحظات المدير</h3>' +
          '<p>ملاحظات إضافية تظهر ضمن التقرير النهائي.</p></div>' +
          '<div class="section-body"><div class="notes-box">' + Mutamad.escapeHtml(safe(report.manager_notes, "لا توجد ملاحظات إضافية من المدير.")) + '</div></div></section>' +

        '<section class="signature-row">' +
          '<div class="signature-card"><span>صادر بواسطة</span><strong>منصة مُعتمد لحوكمة الامتثال</strong></div>' +
          '<div class="signature-card"><span>حالة التوثيق</span><strong>' + Mutamad.escapeHtml(safe(report.stamp, "موثّق")) + '</strong></div>' +
        '</section>' +
      '</div>' +
    '</article>';
  }

  renderReport();
</script>
</body>
</html>
